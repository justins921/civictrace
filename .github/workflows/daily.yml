# CivicTrace daily data refresh.
#
# Free, versioned, and it keeps its own logs. Add three repository secrets
# (Settings -> Secrets and variables -> Actions):
#
#   SUPABASE_URL        https://vzvtlwfvncwwtzntndmy.supabase.co
#   SUPABASE_ANON_KEY   the publishable key
#   CT_INGEST_TOKEN     the write token
#
# The token only works with three database functions and can only touch the
# eleven fact tables. It cannot read auth, edit corrections, or alter the schema.
name: daily refresh

on:
  schedule:
    - cron: '0 9 * * *'      # 09:00 UTC = 4am Central
  workflow_dispatch:          # and a "Run workflow" button for testing

concurrency:
  group: civictrace-refresh
  cancel-in-progress: false   # never let two runs replace the same tables at once

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python daily_update.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CT_INGEST_TOKEN: ${{ secrets.CT_INGEST_TOKEN }}
          CT_SOURCE: github actions
      # Blocks a bad refresh from standing: if any two routes to a published
      # total disagree, this fails and the run is marked failed.
      - run: python check_reconciliation.py
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
